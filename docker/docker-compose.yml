version: "3.8"

services:
  mysql:
    image: mysql:8.0.35
    container_name: forex-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: forex123
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ../sql:/docker-entrypoint-initdb.d
    command:
      - --default-authentication-plugin=mysql_native_password
      - --max_connections=500
      - --innodb_buffer_pool_size=512M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - forex-network

  redis:
    image: redis:7.2-alpine
    container_name: forex-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - forex-network

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: forex-nacos
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_IDENTITY_KEY: forex-nacos
      NACOS_AUTH_IDENTITY_VALUE: forex-nacos
      NACOS_AUTH_TOKEN: SecretKey012345678901234567890123456789012345678901234567890123456789
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos_config
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: forex123
    volumes:
      - ./nacos/conf/application.properties:/home/nacos/conf/application.properties
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - forex-network

  seata-server:
    image: seataio/seata-server:1.8.0
    container_name: forex-seata
    ports:
      - "7091:7091"
      - "8091:8091"
    environment:
      SEATA_PORT: 8091
      STORE_MODE: db
      SEATA_STORE_DB_DATASOURCE: druid
      SEATA_STORE_DB_TYPE: mysql
      SEATA_STORE_DB_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SEATA_STORE_DB_URL: jdbc:mysql://mysql:3306/seata?useUnicode=true&characterEncoding=utf8&useSSL=false
      SEATA_STORE_DB_USER: root
      SEATA_STORE_DB_PASSWORD: forex123
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - forex-network

  rocketmq-namesrv:
    image: apache/rocketmq:5.1.4
    container_name: forex-rmq-namesrv
    ports:
      - "9876:9876"
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "-Xms512m -Xmx512m"
    networks:
      - forex-network

  rocketmq-broker:
    image: apache/rocketmq:5.1.4
    container_name: forex-rmq-broker
    ports:
      - "10911:10911"
      - "10909:10909"
    depends_on:
      - rocketmq-namesrv
    command: sh mqbroker -n rocketmq-namesrv:9876 --enable-proxy
    environment:
      JAVA_OPT_EXT: "-Xms512m -Xmx512m"
      NAMESRV_ADDR: rocketmq-namesrv:9876
    networks:
      - forex-network

volumes:
  mysql-data:
  redis-data:

networks:
  forex-network:
    driver: bridge
