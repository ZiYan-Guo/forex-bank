server:
  port: 8232

spring:
  application:
    name: forex-supply-chain
  datasource:
    url: jdbc:mysql://localhost:3306/forex_supply_chain?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: dev
        group: FOREX_GROUP
      config:
        server-addr: localhost:8848
        namespace: dev
        group: FOREX_GROUP
  data:
    redis:
      host: localhost
      port: 6379

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true
