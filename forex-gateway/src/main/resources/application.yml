server:
  port: 8080

spring:
  application:
    name: forex-gateway
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: dev
        group: FOREX_GROUP
      config:
        server-addr: localhost:8848
        namespace: dev
        group: FOREX_GROUP
        file-extension: yaml
        refresh-enabled: true
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: forex-auth
          uri: lb://forex-auth
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 200
                key-resolver: "#{@ipKeyResolver}"
        - id: forex-customer
          uri: lb://forex-customer
          predicates:
            - Path=/api/customer/**
          filters:
            - StripPrefix=0
        - id: forex-exchange
          uri: lb://forex-exchange
          predicates:
            - Path=/api/exchange/**
          filters:
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1000
                redis-rate-limiter.burstCapacity: 2000
                key-resolver: "#{@ipKeyResolver}"
        - id: forex-trading
          uri: lb://forex-trading
          predicates:
            - Path=/api/trading/**
          filters:
            - StripPrefix=0
        - id: forex-valuation
          uri: lb://forex-valuation
          predicates:
            - Path=/api/valuation/**
          filters:
            - StripPrefix=0
        - id: forex-margin
          uri: lb://forex-margin
          predicates:
            - Path=/api/margin/**
          filters:
            - StripPrefix=0
        - id: forex-position
          uri: lb://forex-position
          predicates:
            - Path=/api/position/**
          filters:
            - StripPrefix=0
        - id: forex-bookkeeping
          uri: lb://forex-bookkeeping
          predicates:
            - Path=/api/bookkeeping/**
          filters:
            - StripPrefix=0
        - id: forex-payment
          uri: lb://forex-payment
          predicates:
            - Path=/api/payment/**
          filters:
            - StripPrefix=0
        - id: forex-settlement
          uri: lb://forex-settlement
          predicates:
            - Path=/api/settlement/**
          filters:
            - StripPrefix=0
        - id: forex-clearing
          uri: lb://forex-clearing
          predicates:
            - Path=/api/clearing/**
          filters:
            - StripPrefix=0
        - id: forex-risk
          uri: lb://forex-risk
          predicates:
            - Path=/api/risk/**
          filters:
            - StripPrefix=0
        - id: forex-reporting
          uri: lb://forex-reporting
          predicates:
            - Path=/api/reporting/**
          filters:
            - StripPrefix=0
        - id: forex-account
          uri: lb://forex-account
          predicates:
            - Path=/api/account/**
          filters:
            - StripPrefix=0
        - id: forex-rate
          uri: lb://forex-rate
          predicates:
            - Path=/api/rate/**
          filters:
            - StripPrefix=0
        - id: forex-workflow
          uri: lb://forex-workflow
          predicates:
            - Path=/api/workflow/**
          filters:
            - StripPrefix=0
        - id: forex-notification
          uri: lb://forex-notification
          predicates:
            - Path=/api/notification/**
          filters:
            - StripPrefix=0
        - id: forex-ocr
          uri: lb://forex-ocr
          predicates:
            - Path=/api/ocr/**
          filters:
            - StripPrefix=0

  redis:
    host: localhost
    port: 6379
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 32
        max-idle: 16
        min-idle: 8

forex:
  security:
    jwt-secret: FxBkSys-2026-Prod-Secret-K3y-Must-Be-At-Least-32-Chars-Long-Enough-For-HS256-Signing!
  gateway:
    ignore-auth-urls:
      - /api/auth/login
      - /api/auth/refresh
      - /api/auth/captcha
      - /api/rate/latest/**
      - /v3/api-docs/**
      - /doc.html
      - /webjars/**
      - /swagger-resources/**
      - /actuator/health

logging:
  level:
    com.forex: DEBUG
    org.springframework.cloud.gateway: INFO
